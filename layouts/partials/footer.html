<div id="footer" class="mb-5 site-footer">
    <hr>
    <div class="site-footer-inner">
        <small class="site-footer-copy">
            {{ with .Site.Params.footer.url }}
            <a href="{{ . }}" title="{{ $.Site.Params.footer.copyright | default "bienkma.github.io" }}">{{ $.Site.Params.footer.copyright | default "© 2021-2026 bienkma" }}</a>
            {{ else }}
            {{ .Site.Params.footer.copyright | default "© 2021-2026 bienkma" }}
            {{ end }}
        </small>
        {{ if .Site.Params.socialIcons }}
        <span class="site-footer-icons" aria-label="Social links">
            {{ range .Site.Params.socialIcons }}
            <a href="{{ .url }}" class="{{ .icon }}" title="{{ .title }}" rel="noopener noreferrer"></a>
            {{ end }}
        </span>
        {{ end }}
    </div>
</div>
<style>
.site-footer .site-footer-inner {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 0.5rem 1rem;
    padding: 0 1rem;
    text-align: center;
}
.site-footer .site-footer-copy {
    color: #222222;
    margin: 0;
    line-height: 1.5;
}
.site-footer .site-footer-copy a {
    color: inherit;
    text-decoration: none;
}
.site-footer .site-footer-copy a:hover {
    color: #dc3545;
    text-decoration: underline;
}
.site-footer .site-footer-icons {
    display: inline-flex;
    align-items: center;
    gap: 0.85rem;
}
.site-footer .site-footer-icons a {
    color: #222222;
    font-size: 1.05rem;
    line-height: 1;
    text-decoration: none;
    opacity: 0.85;
    transition: color 0.15s ease, opacity 0.15s ease;
}
.site-footer .site-footer-icons a:hover {
    color: #dc3545;
    opacity: 1;
    text-decoration: none;
}
</style>
